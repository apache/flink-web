- id: use-cases.event-driven.description
  translation: Olay tabanlı bir uygulama, bir veya daha fazla olay akışından veri alan ve gelen olaylara hesaplamaları tetikleyerek, durumu güncelleyerek veya harici işlemleri başlatarak tepki veren durumlu bir uygulamadır.

- id: use-cases.stream-batch
  translation: Akış ve Toplu Analiz

- id: use-cases.stream-batch.description
  translation: Analitik işler, ham veriden bilgi ve içgörü çıkarır. Apache Flink, sınırlı veri kümeleri üzerinde geleneksel toplu sorguları ve sınırsız, canlı veri akışlarından gerçek zamanlı, sürekli sorguları destekler.

