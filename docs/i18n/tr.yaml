- id: hero.subtitle
  translation: Veri Akışları Üzerinde Durumlu Hesaplamalar

- id: hero.blurb
  translation: Apache Flink, sınırsız ve sınırlı veri akışları üzerinde durumlu hesaplamalar gerçekleştirmek için geliştirilmiş bir framework ve dağıtık işlem motorudur. Flink, tüm yaygın cluster ortamlarında çalışacak şekilde tasarlanmıştır; bellek içi hızda ve her ölçekte işlem yapabilir.

