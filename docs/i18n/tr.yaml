  translation: Veri Hatları ve ETL

- id: use-cases.pipelines-etl.description
  translation: ETL (Çıkar-Dönüştür-Yükle), veriyi depolama sistemleri arasında dönüştürmek ve taşımak için yaygın bir yaklaşımdır.

